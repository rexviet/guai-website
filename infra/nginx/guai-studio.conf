# Nginx reverse proxy + static-site config for GuAI Studio.
#
# TOPOLOGY
#   guai.studio      → Astro static build, served from /var/www/guai-studio/current
#   cms.guai.studio  → Strapi v5, proxied to 127.0.0.1:1337
#
# TLS MODEL: Cloudflare "Full (strict)" with a Cloudflare Origin Certificate.
# Cloudflare terminates TLS for the browser and opens a SECOND TLS connection
# to this origin, validating the certificate. An Origin CA certificate is
# issued by Cloudflare's own CA — untrusted by browsers, but explicitly
# trusted by Cloudflare — which is exactly what Full (strict) requires.
#
# Why not Certbot/Let's Encrypt: the HTTP-01 challenge is answered at the
# Cloudflare edge, so enabling "Always Use HTTPS" 301s the challenge before it
# reaches this box and issuance fails. Origin certificates need no ACME
# challenge and last 15 years, so there is no renewal cron to forget either.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP ON THE VPS
#
# 1. Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate.
#    Hostnames: `guai.studio, *.guai.studio` (one cert covers both server
#    blocks below). Save the two PEM blobs:
#      /opt/ssl/cert.pem       (certificate)
#      /opt/ssl/private.key    (private key)
#    chmod 600 the key, chown root:root both.
#
# 2. Cloudflare dashboard → SSL/TLS → Overview → set mode to **Full (strict)**.
#    Setting this BEFORE the cert is installed will take the site down with
#    Error 526, so do step 1 first.
#
# 3. Both records orange-clouded (proxied) in Cloudflare DNS.
#
# 4. Firewall the origin so Cloudflare is the only way in — otherwise anyone
#    who learns the VPS IP reaches /admin directly, bypassing Cloudflare's WAF
#    and rate limiting entirely:
#      for ip in $(curl -s https://www.cloudflare.com/ips-v4); do
#        ufw allow from $ip to any port 80,443 proto tcp; done
#      for ip in $(curl -s https://www.cloudflare.com/ips-v6); do
#        ufw allow from $ip to any port 80,443 proto tcp; done
#      ufw deny 80/tcp && ufw deny 443/tcp   # everything not from Cloudflare
#
# 5. Install, validate, reload:
#      nginx -t && systemctl reload nginx
#
# NOTE: unlike the previous revision of this file, `nginx -t` can no longer be
# run standalone without the certificate files existing — the 443 blocks are
# live, not commented out. To syntax-check on a machine without them, generate
# a throwaway self-signed pair at the same paths first.
#
# ---------------------------------------------------------------------------
# NGINX VERSION — this file targets the VPS's nginx 1.24.0 (Ubuntu package).
# Verified with `nginx -t` against nginx:1.24-alpine: no errors, no warnings.
#
# HTTP/2 is therefore enabled with the `http2` LISTEN PARAMETER rather than the
# `http2 on;` directive, which only exists from nginx 1.25.1. Note that the
# parameter is a property of the listening SOCKET, not of the server block, so
# it is declared exactly once — on the default_server below. Repeating it on
# the other 443 blocks makes nginx warn "protocol options redefined for
# 0.0.0.0:443" while changing nothing.
#
# If nginx is ever upgraded past 1.25.1 (e.g. by switching to nginx.org's own
# repo), the listen parameter still works but is deprecated; the modern form
# is a per-server `http2 on;`.
#
# `ssl_reject_handshake` (default_server block) needs nginx >= 1.19.4. On
# anything older, delete that block and rely on the ufw rules for origin
# protection.
# ---------------------------------------------------------------------------

# Upgrade the `Connection` header only for actual websocket upgrade requests;
# otherwise close it per the standard reverse-proxy recipe.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Restore the real client IP from Cloudflare.
#
# Without this every request appears to come from a Cloudflare edge IP. That
# is not cosmetic here: apps/cms/src/api/lead/controllers/lead.ts persists
# `ip_address` on each lead and forwards `remoteip` to Cloudflare Turnstile's
# siteverify endpoint, so spam triage and bot scoring both depend on it.
#
# This alone is NOT sufficient — Strapi must also be told to trust the
# forwarded headers via `proxy: { koa: true }` in apps/cms/config/server.ts
# (note the nesting: Strapi v5 reads `server.proxy.koa`, and a bare
# `proxy: true` silently does nothing). Koa ignores X-Forwarded-For unless
# that flag is set, and `ctx.ip` would stay the socket peer no matter what is
# configured here.
#
# Ranges below are from https://www.cloudflare.com/ips/ — they change rarely
# but they DO change. Consider a monthly cron that regenerates this list into
# an included file and reloads nginx.
# ---------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# CF-Connecting-IP always holds the true client address and, unlike
# X-Forwarded-For, cannot be spoofed by the client (Cloudflare overwrites it).
real_ip_header CF-Connecting-IP;

# Shared TLS parameters. Certbot used to supply these via
# options-ssl-nginx.conf; with Origin certificates we own them.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---------------------------------------------------------------------------
# Port 80. Under Full (strict) Cloudflare speaks HTTPS to the origin, so this
# block only catches direct/legacy hits and redirects them. The ACME challenge
# location is gone on purpose — Origin certificates do not use ACME.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name guai.studio www.guai.studio cms.guai.studio;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Reject anything that does not match a known hostname, including probes that
# connect straight to the VPS IP. `ssl_reject_handshake` drops the TLS
# handshake without presenting a certificate, so the origin certificate is
# never leaked to scanners. Requires nginx >= 1.19.4.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

# ---------------------------------------------------------------------------
# guai.studio — Astro static site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guai.studio www.guai.studio;

    ssl_certificate     /opt/ssl/cert.pem;
    ssl_certificate_key /opt/ssl/private.key;

    # Authenticated Origin Pulls (mTLS): makes the origin refuse any request
    # that did not come through Cloudflare, which is a stronger guarantee than
    # the ufw rules above because it survives the IP list going stale. Enable
    # only AFTER downloading Cloudflare's origin-pull CA and turning the
    # feature on in the dashboard (SSL/TLS → Origin Server → Authenticated
    # Origin Pulls), or every request will 400.
    #   curl -o /opt/ssl/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    # ssl_client_certificate /opt/ssl/origin-pull-ca.pem;
    # ssl_verify_client on;

    root /var/www/guai-studio/current;
    index index.html;

    # Astro emits content-hashed filenames under /_astro/, so these are safe
    # to cache forever. Cloudflare caches them at the edge too; this header is
    # what tells it (and the browser) that it may.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Real 404s, not a SPA-style catch-all: this is a multi-page Astro SSG
        # site whose success criteria is Google indexing every page, so an
        # unmatched URL must not soft-200 to the homepage (Search Console
        # flags that as a soft-404 and it hurts crawl quality).
        try_files $uri $uri/ =404;
    }
}

# ---------------------------------------------------------------------------
# cms.guai.studio — Strapi v5
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cms.guai.studio;

    ssl_certificate     /opt/ssl/cert.pem;
    ssl_certificate_key /opt/ssl/private.key;

    # See the note in the guai.studio block before enabling.
    # ssl_client_certificate /opt/ssl/origin-pull-ca.pem;
    # ssl_verify_client on;

    # Media Library uploads (showreel, case-study thumbnails, KOL avatars,
    # lead-form attachments) exceed Nginx's 1MB default. Kept under
    # Cloudflare's own 100MB request cap on the Free plan — raising this past
    # 100m would only move the failure to the edge, where it returns 413
    # before nginx ever sees the request.
    client_max_body_size 50m;

    # Uploads are streamed on to Cloudflare R2 by Strapi, so a slow client or
    # a large file can hold the upstream connection well past the 60s default.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;

    # Proxy EVERYTHING, not just /api and /admin. Strapi v5 mounts admin-side
    # plugin APIs at the root — /content-manager, /upload, /i18n and
    # /content-type-builder all live there (verified: they answer 401, i.e.
    # the route exists and only auth is missing). The previous revision of
    # this file proxied only /api and /admin, which let the admin panel load
    # its bundle and then fail every request it made: no content listing, no
    # media upload, no locale switching.
    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme is https here, which is what Strapi needs to build absolute
        # URLs and to mark session cookies Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
