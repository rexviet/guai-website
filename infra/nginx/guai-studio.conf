# Nginx reverse proxy + static-site config for GuAI Studio.
#
# NOTE: replace `guai-studio.example.com` everywhere below with the real
# domain name before deploying to the VPS.
#
# NOTE: this file is self-contained (no external `include`s of files that
# don't ship with this repo) so `nginx -t` can validate it standalone, e.g.:
#   docker run --rm \
#     -v "$(pwd)/infra/nginx/guai-studio.conf:/etc/nginx/conf.d/guai-studio.conf:ro" \
#     nginx:stable nginx -t
# On the real VPS it is dropped into /etc/nginx/conf.d/ (or
# sites-available/sites-enabled), which is included from nginx.conf's `http`
# block — that's also where this top-level `map` directive needs to live.
#
# Deployment flow on the VPS (see infra/scripts + Phase 6/7 of the plan):
#   1. Install this file at /etc/nginx/sites-available/guai-studio.conf (or
#      /etc/nginx/conf.d/guai-studio.conf on distros without sites-enabled),
#      symlink into sites-enabled if applicable, `nginx -t`, `systemctl reload nginx`.
#   2. Point the domain's DNS A/AAAA record at the VPS IP (via Cloudflare).
#   3. Run `certbot --nginx -d guai-studio.example.com` on the VPS. Certbot
#      will automatically edit THIS file in place: it adds `listen 443 ssl;`
#      + `ssl_certificate`/`ssl_certificate_key` directives to the server
#      block below, and (if you accept its prompt) rewrites the port-80
#      server block to redirect to HTTPS. The commented-out `listen 443`
#      block below is a head start / documents the expected final shape so
#      `nginx -t` never has to fail on missing cert files before Certbot has
#      run.

# Upgrade the `Connection` header only for actual websocket upgrade requests
# (Strapi admin's live-reload/preview features may use them); otherwise close
# it per the standard reverse-proxy recipe for optional websocket support.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# HTTP (port 80): Certbot ACME HTTP-01 challenge + app traffic until a
# certificate exists. Once Certbot has run, it will insert a redirect to
# https:// here (or you can uncomment the `return 301` block below yourself).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name guai-studio.example.com;

    # Strapi Media Library uploads (hero showreel, case-study thumbnails, KOL
    # avatars, lead-form attachments) regularly exceed Nginx's 1MB default.
    client_max_body_size 50m;

    # Certbot HTTP-01 domain validation. Must stay reachable over plain HTTP
    # even after HTTPS is enabled, so this location is deliberately placed
    # before any HTTPS redirect and is never proxied.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Once a certificate exists (after running `certbot --nginx`), uncomment
    # the redirect below and remove/comment the proxy/static blocks further
    # down in this server block so all non-ACME traffic moves to HTTPS.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # --- Until HTTPS is provisioned, serve the app directly over HTTP so the
    # site is reachable immediately after the first deploy. ---
    #
    # `proxy_pass http://127.0.0.1:1337` targets Strapi via the port it
    # publishes to the HOST (see infra/docker-compose.yml `strapi.ports`,
    # "1337:1337"). Nginx runs directly on the VPS host (not in the compose
    # network), so it reaches Strapi over localhost. If Nginx were instead
    # run as a container on the same Docker network as `strapi`, this would
    # be `proxy_pass http://strapi:1337` (the compose service name) instead.
    location /api {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /admin {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Astro static build output, deploy-swapped via a `current` symlink
    # (later phase's deploy pipeline). Directory doesn't need to exist yet.
    location / {
        root /var/www/guai-studio/current;
        index index.html;
        # Real 404s, not a SPA-style catch-all: this is a multi-page Astro SSG
        # site whose success criteria is Google indexing every page, so an
        # unmatched URL must not soft-200 to the homepage (Search Console
        # flags that as a soft-404 and it hurts crawl quality).
        try_files $uri $uri/ =404;
    }
}

